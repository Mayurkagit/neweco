name: Execute Telegram Downloader Pipeline

on:
  workflow_dispatch: # Allows you to manually trigger it from the GitHub "Actions" tab

jobs:
  download-and-extract:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Initialize Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Utilities (7z Archive Handler)
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Telegram Downloader Pipeline
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
        START_LINK: ${{ secrets.START_LINK }}
        END_LINK: ${{ secrets.END_LINK }}
        BUNNY_LIBRARY_ID: ${{ secrets.BUNNY_LIBRARY_ID }}
        BUNNY_STREAM_KEY: ${{ secrets.BUNNY_STREAM_KEY }}
        # SOCKS5 Proxy Routing Layer Mappings
        PROXY_IP: ${{ secrets.PROXY_IP }}
        PROXY_PORT: ${{ secrets.PROXY_PORT }}
      run: |
        python download.py
